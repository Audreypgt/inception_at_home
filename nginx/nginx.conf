user www.data;
# user under which nginx is running

worker_processes auto;
# indicates to nginx the number of processes the server must create to handle the client's request
# auto will adjust according to the number of CPU cores our server has

pid /run/nginx.pid;
# file where the PID (Process ID) is stored, this is the default one

events {}
# used to define parameters linked to the connexion (between server and host machine) and network
# events handled (http request received/sent, connexion established by client) by nginx
# we must keep it otherwise nginx will raise an error

http {
    include /etc/nginx/mime.types;
    # translates files names to their corresponding extension
    # used here because otherwise we have errors with CSS
    server {
        # setting up the reverse proxy server
        # --> a server that receives requests from clients, passes them to the backend servers,
        # retrieves their responses and sends them to the clients
        listen 443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        root /var/www/wordpress; # or /data/www/wordpress ??
        # setting up the serving out of static files
        # this is were we'll find our WordPress
        # indicates to the server whre the site content is
        # scan be found at /data/www on hard drive
        # when a client requests a page, nginx takes the URI and adds it simply to this
        # path to find the physical file
        # ex: user goes to this link http://votre-site.com/images/logo.png, nginx gets it from
        # this link /data/www/images/logo.png
        # you can put anything after the / of location /, to redirect the request to different
        # static files, for ex location /images/ will redirect to a certain file if the URI contains
        # images (ex: this request http://localhost/images/example.png will send the
        # /data/images/example.png file)
        # server_name apeuget.42.fr;
        server_name localhost
        #the domain name

        index index.php
        # file(s) to look for when a request for an index is made
        # it's the default homepage file that web servers look for when someone visits a website
        # in pro settings, we add index.php or other to provide fallbacks if index.html isn't found
        # and to allow easier script tests like php scripts 

        location / {
            include snippets/fastcgi-php.conf;
            # # to be able to use fastcgi I guess ? --> from grademe tuto
            # include fastcgi_param;\
            # + script en plus, check repo 42 ?
            try_files $uri $uri/ =404;
            # when client requests a URL, nginx will try $uri (the requested URL as is), if it fails
            # with 404 error, it tries the same URL with a / in front to find a folder ($uri/), if it
            # fails again, it will redirect to the index file, if it fails again, it will send a 404
            # error to the client
            # for PHP, it is usual to send to the index PHP file with the argument as parameter (the 404 
            # redirection is safer because the next one can allow anyone who can upload an image to your 
            # website to add a PHP script to it that will be run)
            # try_files $uri $uri/ /default/index.php$is_args$args;
            # it performs an internal redirect to /default/index.php, because the URI now ends in .php,
            # Nginx will trigger the location ~ \.php$ block, this block sends the request to PHP-FPM via
            # fastcgi_pass, PHP-FPM then executes the script, and that generates the HTML
            # the $isargs$args evaluates to ? if there are arguments, or an empty string if there are none
            # this prevents URLs like index.php? when no arguments exist
            # $args: Contains the actual query string
            # the usefulness of the try_files directive builds entirely on the assumption that you don’t
            # know where all your static files are located
        
        location ~ \.php$ {
            fastcgi_pass wordpress:9000;
            # all requests with php in it are sent through fastcgi to our wordpress container through port 9000
        }
        }
    }
}