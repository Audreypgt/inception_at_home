services:
  nginx:
      container_name: nginx
      build:
          context: requirements/nginx
      restart: unless-stopped
      ports:
          - "443:443"
      depends_on:
        - wordpress
      networks:
        - docker-network
      volumes:
          - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:rw
          - wordpress_vol:/var/www/wordpress
  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
    restart: unless-stopped
    env_file: .env
    networks:
      - docker-network
    volumes:
      - mariadb_vol:/var/lib/mysql
  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - docker-network
    volumes:
      - wordpress_vol:/var/www/wordpress
      - ./requirements/wordpress/conf/www.conf:/etc/php/8.2/fpm/pool.d/www.conf:rw
      - ./requirements/wordpress/tools/config_script.sh:/var/www/wordpress/config_script.sh:xrw

networks:
  docker-network:
    driver: bridge 

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/wordpress

